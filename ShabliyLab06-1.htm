
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Використання сенсорних зображень</title>
</head>
<body>

    <!-- Створюємо карту зображення -->
    <map name="map1">
        <area shape="rect" coords="0,0,300,260"
              href="Primerlab05_1.html"
              title="Водоспад"
              alt="Водоспад">
    </map>

    <!-- Застосовуємо карту до малюнку -->
    <center>
        <img src="image/vodopad.jpeg"
     width="300"
     height="260"
     border="2"
     usemap="#map1"
     alt="Водоспад">
    </center>

</body>
</html>
